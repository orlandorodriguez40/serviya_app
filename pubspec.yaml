name: serviya
description: "Proyecto de servicios para hogares y empresas - ServiYa."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Paquete para conectar con las API en tupaginalista.com
  http: ^1.2.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Cuando tengas el logo de ServiYa, lo habilitaremos aquí:
  assets:
    - assets/images/